<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business card</title>
<style>
  :root{
    --navy:#2b3985; --ink:#192042; --muted:#5c6481; --accent:#6dc5ea;
    --panel:#eef8fc; --bg:#f3f5f9; --card:#ffffff; --line:#e3e7ef;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px}

  /* ---------- cartão ---------- */
  .card{display:flex;background:var(--card);border-radius:14px;overflow:hidden;
    box-shadow:0 1px 2px rgba(25,32,66,.06),0 8px 28px rgba(25,32,66,.10);aspect-ratio:9/5}
  .logos{flex:0 0 31%;background:var(--panel);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:9%;padding:6% 4%}
  .logos img{display:block;max-width:100%;height:auto}
  .logos .ita{width:86%} .logos .lab{width:52%}
  .info{flex:1;padding:7% 6% 6% 7%;display:flex;flex-direction:column;min-width:0}
  .name{font-weight:700;color:var(--navy);font-size:clamp(17px,5.4vw,27px);line-height:1.1;margin:0;letter-spacing:-.01em}
  .rule{width:42px;height:4px;border-radius:2px;background:var(--accent);margin:9px 0 9px}
  .role{font-weight:600;font-size:clamp(11px,3vw,15px);margin:0 0 3px}
  .line{color:var(--muted);font-size:clamp(9.5px,2.45vw,12.5px);margin:0;line-height:1.4}
  .contact{margin-top:auto;display:grid;gap:5px;font-size:clamp(10px,2.7vw,13.5px)}
  .contact span{display:flex;align-items:center;gap:7px;overflow-wrap:anywhere}
  .ico{flex:0 0 auto;width:1.5em;height:1.5em;border-radius:50%;background:#eaf3fb;
    display:inline-flex;align-items:center;justify-content:center}
  .ico svg{width:.85em;height:.85em;fill:var(--navy)}

  /* celular: logos em faixa no topo, texto embaixo */
  @media (max-width:520px){
    .card{flex-direction:column;aspect-ratio:auto}
    .logos{flex:none;flex-direction:row;gap:28px;padding:18px 20px}
    .logos .ita{width:130px} .logos .lab{width:64px}
    .info{padding:22px 22px 20px}
    .name{font-size:26px} .role{font-size:15.5px} .line{font-size:13.5px}
    .contact{margin-top:16px;font-size:15px;gap:8px}
  }

  /* ---------- botões ---------- */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:12px;padding:13px 12px;font:inherit;font-weight:600;font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer}
  .btn svg{width:18px;height:18px;fill:currentColor}
  .btn.primary{grid-column:1/-1;background:var(--navy);border-color:var(--navy);color:#fff;font-size:16px;padding:15px}
  .btn:active{transform:translateY(1px)}
  .btn[hidden]{display:none}

  /* ---------- CV ---------- */
  section.cv{background:#fff;border-radius:14px;border:1px solid var(--line);padding:18px 18px 6px;margin-top:18px}
  .cv h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
  .cv p,.cv li{font-size:14.5px;line-height:1.5;margin:0 0 14px}
  .cv ul{padding-left:18px;margin:0 0 14px} .cv li{margin-bottom:6px}
  .cv a{color:var(--navy)}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .links a{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none;font-weight:600}

  /* ---------- QR ---------- */
  dialog{border:0;border-radius:18px;padding:24px;max-width:340px;width:calc(100% - 32px);text-align:center}
  dialog::backdrop{background:rgba(25,32,66,.55)}
  #qr svg{width:100%;height:auto;display:block}
  dialog p{color:var(--muted);font-size:14px;margin:12px 0 16px}
  .tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:16px}
  .tabs button{flex:1;border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:8px;border-radius:8px;cursor:pointer}
  .tabs button:focus{outline:none} .tabs button:focus-visible{outline:2px solid var(--accent)}
  .tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(25,32,66,.12)}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
</style>
</head>

<script>
/* =====================================================================
   EDITE SEUS DADOS AQUI
   Troque só o texto entre aspas. Para não mostrar um campo, deixe "".
   ===================================================================== */
const DADOS = {
  nome:        "Ricardo",
  sobrenome:   "Soares",          // usado no contato salvo na agenda
  nomeExibido: "Ricardo Felipe Soares",  // como aparece no cartão
  cargo:       "PhD Candidate ITA",        // ex.: PhD Candidate · ITA
  linha1:      "Major Pharmacist/ Officer · Brazilian Air Force",
  linha2:      "Bioengineer Lab / Space Sciences Technologies",
  linha3:      "Aeronautics Institute of Technology",
  organizacao: "Aeronautics Institute of Technology",        // vai no campo "Empresa" do contato
  telefone:    "+55 12 99781-9328",    // com +55 e DDD
  email:       "ricardorfs@ita.br",
  site:        "https://ricardorfs1205.github.io",                     // opcional: ex. https://seusite.github.io

  /* Resumo de CV (opcional). Deixe resumo "" e as listas vazias [] para esconder. */
  resumo: "Space Microbiology",
  formacao: [
    "PhD in Science — Aeronautics Institute of Technology (2024–present)",
    "MSc in Science — Oswaldo Cruz Foudation (2013)"
  ],
  publicacoes: [
    // { titulo: "Article title", revista: "Journal, 2026", link: "https://doi.org/..." }
  ],
  links: [
    // { rotulo: "ORCID",   url: "https://orcid.org/0000-0000-0000-0000" },
    // { rotulo: "Lattes",  url: "http://lattes.cnpq.br/0000000000000000" },
    // { rotulo: "LinkedIn",url: "https://www.linkedin.com/in/..." }
  ],

  idioma: "en"   // "en" (inglês) ou "pt" (português) — textos dos botões e títulos
};
/* ===================== FIM DA PARTE EDITÁVEL ===================== */

const T = {
  pt:{save:"Salvar contato",qr:"Mostrar QR code",close:"Fechar",dl:"Baixar QR como imagem",
      tabLink:"Link do cartão",tabVcf:"Contato offline",
      hintLink:"Aponte a câmera do celular para abrir este cartão.",
      hintVcf:"Aponte a câmera: o contato é adicionado direto, mesmo sem internet.",
      hintLocal:"Publique o site (ou preencha o campo “site”) para gerar o QR do link.",
      about:"Sobre",edu:"Formação",pubs:"Publicações selecionadas",links:"Links",foot:"Cartão de visita digital"},
  en:{save:"Save contact",qr:"Show QR code",close:"Close",dl:"Download QR image",
      tabLink:"Card link",tabVcf:"Offline contact",
      hintLink:"Point your phone camera here to open this card.",
      hintVcf:"Point your camera here: the contact is added directly, no internet needed.",
      hintLocal:"Publish the site (or fill in the “site” field) to generate the link QR.",
      about:"About",edu:"Education",pubs:"Selected publications",links:"Links",foot:"Digital business card"}
};
const t = T[DADOS.idioma] || T.pt;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const digits = s => s.replace(/\D/g,"");

document.documentElement.lang = DADOS.idioma === "en" ? "en" : "pt-BR";
document.title = DADOS.nomeExibido;
document.querySelectorAll("[data-t]").forEach(e => e.textContent = t[e.dataset.t]);
$("foot").textContent = t.foot;

function fill(id, v){ const e=$(id); if(v) e.textContent=v; else e.remove(); }
fill("c-name",DADOS.nomeExibido); fill("c-role",DADOS.cargo);
fill("c-l1",DADOS.linha1); fill("c-l2",DADOS.linha2); fill("c-l3",DADOS.linha3);
if(DADOS.telefone) $("c-phone").querySelector("b").textContent=DADOS.telefone; else $("c-phone").remove();
if(DADOS.email) $("c-email").querySelector("b").textContent=DADOS.email; else $("c-email").remove();

if(DADOS.telefone) $("wa").href="https://wa.me/"+digits(DADOS.telefone); else $("wa").hidden=true;
if(DADOS.email) $("mail").href="mailto:"+DADOS.email; else $("mail").hidden=true;

/* ---------- CV ---------- */
(function(){
  let h="";
  if(DADOS.resumo) h+=`<h2>${t.about}</h2><p>${esc(DADOS.resumo)}</p>`;
  if(DADOS.formacao.length) h+=`<h2>${t.edu}</h2><ul>${DADOS.formacao.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`;
  if(DADOS.publicacoes.length) h+=`<h2>${t.pubs}</h2><ul>${DADOS.publicacoes.map(p=>
     `<li>${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.titulo)}</a>`:esc(p.titulo)}${p.revista?` — <i>${esc(p.revista)}</i>`:""}</li>`).join("")}</ul>`;
  if(DADOS.links.length) h+=`<h2>${t.links}</h2><div class="links">${DADOS.links.map(l=>
     `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.rotulo)}</a>`).join("")}</div>`;
  if(h){ $("cv").innerHTML=h; $("cv").hidden=false; }
})();

/* ---------- Salvar contato (vCard) ---------- */
function vcard(){
  const v=s=>String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1");
  const L=["BEGIN:VCARD","VERSION:3.0",
    `N:${v(DADOS.sobrenome)};${v(DADOS.nome)};;;`,`FN:${v(DADOS.nomeExibido)}`];
  if(DADOS.organizacao) L.push(`ORG:${v(DADOS.organizacao)}`);
  if(DADOS.cargo) L.push(`TITLE:${v(DADOS.cargo)}`);
  if(DADOS.telefone) L.push(`TEL;TYPE=CELL:${DADOS.telefone.replace(/[^\d+]/g,"")}`);
  if(DADOS.email) L.push(`EMAIL;TYPE=INTERNET:${DADOS.email}`);
  const url = DADOS.site || (location.protocol.startsWith("http") ? location.href.split("#")[0] : "");
  if(url) L.push(`URL:${url}`);
  const note=[DADOS.linha1,DADOS.linha2,DADOS.linha3].filter(Boolean).join(" | ");
  if(note) L.push(`NOTE:${v(note)}`);
  L.push("END:VCARD");
  return L.join("\r\n");
}
$("save").onclick=()=>{
  const blob=new Blob([vcard()],{type:"text/vcard;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(DADOS.nomeExibido||"contato").replace(/[^\p{L}\p{N} ]/gu,"").trim().replace(/\s+/g,"_")+".vcf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};

/* ---------- QR code do endereço desta página ---------- */
let qrMode="link", qrObj=null;
function pageUrl(){
  if(DADOS.site) return DADOS.site;
  return location.protocol.startsWith("http") ? location.href.split("#")[0] : "";
}
function drawQR(){
  $("tab-link").classList.toggle("on",qrMode==="link");
  $("tab-vcf").classList.toggle("on",qrMode==="vcf");
  const data = qrMode==="link" ? pageUrl() : vcard();
  if(!data){ $("qr").innerHTML=""; $("qrhint").textContent=t.hintLocal; $("dlqr").hidden=true; qrObj=null; return; }
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const q=qrcode(0, qrMode==="link" ? "M" : "L"); q.addData(data); q.make(); qrObj=q;
  $("qr").innerHTML=q.createSvgTag({cellSize:6,margin:2,scalable:true});
  $("qrhint").textContent = qrMode==="link" ? t.hintLink : t.hintVcf;
